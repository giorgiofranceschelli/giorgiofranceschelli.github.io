# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Giorgio Franceschelli
author: Giorgio Franceschelli
email: giorgio.franceschelli@unibo.it
description: >- # this means to ignore newlines until "baseurl:"
  Hi! I am a PhD student in Computer Science and Engineering at University of Bologna.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://giorgiofranceschelli.github.io/" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: Gionceschelli
github_username:  giorgiofranceschelli

# Build settings
#theme: "alembic-jekyll-theme"
remote_theme: daviddarnes/alembic@main
plugins:
  - jekyll-feed
  - jekyll-remote-theme

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

defaults:
  -
    scope:
      path: ""
    values:
      image: "/assets/default-social-image.png" # Default image for sharing
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: post # Set the default layout for posts
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages

# 7. Site settings
encoding: utf-8 # Make sure the encoding is right
lang: en-GB # Set the site language
title: "Giorgio Franceschelli" # Site name or title, also used in jekyll-seo-tag
logo: "/assets/logos/logo.svg" # Site logo, also used in jekyll-seo-tag
description: "This is the personal webpage of Giorgio Franceschelli, PhD" # Site description and default description, also used in jekyll-seo-tag
url: "https://giorgiofranceschelli.github.io/" # Site url, also used in jekyll-seo-tag
baseurl: ""
repo: "https://github.com/giorgiofranceschelli/giorgiofranceschelli.github.io"
email: "giorgio.franceschelli@unibo.it"
# disqus: "alembic-1" # Blog post comments, uncomment the option and set the site ID from your Disqus account
# date_format: "%-d %B %Y" # Blog post date formatting using placeholder formatting
# google_analytics: ""
# google_analytics_anonymize_ip: ""
# service_worker: false # Will turn off the service worker if set to false
# short_name: "Al" # The web application short name, defaults to the site title
css_inline: true # Will insert all styles into a single <style> block in the <head> element and remove the style <link> reference

navigation_header:
- title: Home
  url: /
- title: Research
  url: /papers
- title: Teaching and Talks
  url: /academic
- title: More
  url: /more
 
navigation_footer:
- title: Powered by Jekyll and Alembic
  url: https://alembic.darn.es/
 
social_links: # Appears in sidebar. Set the urls then uncomment and comment out as desired
  Email: mailto:giorgio.franceschelli@unibo.it
  Twitter: https://twitter.com/Gionceschelli
  LinkedIn: https://it.linkedin.com/in/giorgio-franceschelli-171b83194
  GitHub: https://github.com/giorgiofranceschelli

favicons: true

# Load custom fonts from fonts.google.com etc
#
# TIP: Try to keep the number of urls as low to reduce the performance cost
#      If multiple fonts can be requested in a single url opt for this
fonts:
  preconnect_urls:
    - https://fonts.gstatic.com
  font_urls:
    - https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap
